、惊讶等基本情绪 。通过捕捉和解读面部特征，如眼睛、眉毛和嘴部的动作，这类\n系统能在实时或预录的视频中判断人的情感状态，广泛应用于人机交互 、市场调研 、医疗健\n康监测、安全监控及教育科技等多个领域，为提升用户体验 、增进情感智能和优化社会服务\n提供了有力工具。\nAI模型说明：提供的已训练的模型 “emotion-ferplus.onnx ”，其专门用于进行面部表情\n识别。 定义情感类别与数字标签的映射表为{'neutral':0, 'happiness':1, 'surprise':2,\n'sadness':3, 'anger':4, 'disgust':5, 'fear':6, 'contempt':7} 。\n该模型的使用交互流程为：\n1)加载模型 “emotion-ferplus.onnx ”和加载情感类别与数字标签的映射表；\n2)加载一张本地图片 “img_test.png ”，并预处理图像；\n3)使用已训练的模型对图片面部表情识别；\n4)输出识别后的表情标签。\n你作为一名人工智能训练师，请完成以下工作任务：\n（1）补全该模型的使用交互流程对应的Python代码（3.2.3.ipynb ），实现本地测试图片\n（2）在上面的使用交互流程基础上，给出在面部表情识别系统中使用\n“emotion-ferplus.onnx ”模型的一种人机交互的最优方式，将其保存为docx文件，命名\n为3.2.3.docx 。\n所有结果文件储存在桌面新建的考生文件夹中，文件夹命名为 “准考证号 +身份证号后六\n位”。\n3.技能要求\n（1）能确保模型在单一场景下稳定运行；\n（2）能通过分析，找到单一场景下人工和智能交互的最优方式。\n4.质量指标\n（1）模型运行稳定，使用正常；\n（2）单一场景下人工和智能交互的最优方式切实可行。\nR6# 导入必要的库\nimport numpy as np\nfrom PIL import  Image\nimport onnxruntime  as ort\n# 定义预处理函数，用于将图片转换为模型所需的输入格式\ndef preprocess(image_path ):\ninput_shape  = (1, 1, 64, 64)    # 模型输入期望的形状，这里是  (N, C, H, W) ，N=batch size, C=channels, H=height, W=width\nimg = Image.open(image_path ).convert('L')    # 打开图像文件并将其转换为灰度图1分\nimg = img.resize((64, 64), Image.ANTIALIAS )    # 调整图像大小到模型输入所需的尺寸\nimg_data  = np.array(img, dtype=np.float32)    # 将PIL图像对象转换为numpy数组，并确保数据类型是float32\n# 调整数组的形状以匹配模型输入的形状\nimg_data  = np.expand_dims(img_data , axis=0)  # 添加batch维度\nimg_data  = np.expand_dims(img_data , axis=1)  # 添加channel维度\nassert  img_data .shape == input_shape , f\"Expected shape {input_shape }, but got {img_data .shape}\"    # 确保最终的形状与模型输\nreturn  img_data     # 返回预处理后的图像数据\n# 定义情感类别与数字标签的映射表3分\nemotion_table  = {'neutral' :0, 'happiness' :1, 'surprise' :2, 'sadness' :3, 'anger':4, 'disgust' :5, 'fear' :6, 'contempt' :7}\n# 加载模型3分\nort_session  = ort.InferenceSession('emotion-ferplus.onnx' )    # 使用onnxruntime创建一个会话，用于加载并运行模型\n# 加载本地图片并进行预处理3分\ninput_data  = preprocess('img_test.png' )\n# 准备输入数据，确保其符合模型输入的要求\nort_inputs  = {ort_session .get_inputs()[0].name: input_data }    # ort_session.get_inputs()[0].name是获取模型的第一个输入的名字\n# 运行模型，进行预测3分\nort_outs  = ort_session .run(None, ort_inputs )", "scoring": "试题名称：面部表情识别系统交互流程设计\n考核时间：20min\n测量分评分表细则编\n号配分评分细则描述规定或\n标称值结果或\n实际值得分\nM1 3定义情感类别与数字标签的映射表\n代码正确得3分；根据数\n据\nM2 3模型加载代码正确得3分；根据数\n据\nM3 3加载本地图片并进行预处理代码正\n确得3分；根据数\n据\nM4 3运行模型，进行预测代码正确得3\n分；根据数\n据\nM5 3解码模型输出，找到预测概率最高\n的情感类别代码正确得3分；根据数\n据\nM6 3根据预测的标签找到对应的情感名\n称代码正确得3分；根据数\n据\nM7 1截图3.2.3-1.jpg中识别的面部情\n绪正确：得1分；根据数\n据\nM8 1人机交互最优流程（不少于3条）\n正确得1分；根据数\n据\n合计配\n分20合计得分\n试题单", "reference": "In [2]:\nR6# 解码模型输出，找到预测概率最高的情感类别3分\npredicted_label  = np.argmax(ort_outs [0])\n# 根据预测的标签找到对应的情感名称3分\npredicted_emotion  = list(emotion_table .keys())[predicted_label ]\n# 输出预测的情感\nprint(f\"Predicted emotion: {predicted_emotion }\")\nPredicted emotion: surprise\nIn [ ]:\nR6请勿修改答题卷，在指定单元格内填写答案\n人机交互的最优方式（答对3条以上正确得1分）\n1)加载模型“emotion-ferplus.onnx”和加载情感类别与数字标签的映射表；\n2)加载一张本地图片“img_test.png” ，并预处理图像；\n3)使用已训练的模型对图片面部表情识别；\n4)输出识别后的表情标签。\n5.用户界面设计：提供一个简洁直观的用户界面，方便用户上传图片和查看识\n别结果。", "id": 28, "page": 175}, {"name": "花朵智能识别系统交互流程设计", "time": "20min", "question": "1.场地设备要求\n（1）人工智能训练师主机1台；\n（2）Python编译环境；\n（3）Pytorch框架。\n2.工作任务\n花朵智能识别系统在现代城市绿化管理中起着越来越重要的作用，其利用先进的计算机视觉\n技术，如花朵检测与识别，实现了对花朵种类的实时监控与管理 。本系统要求开发一个基于\n已训练模型的花朵检测与分类系统，能够准确识别出不同类别的花朵。\nAI模型说明：提供的模型 “flower-detection.onnx ”是使用Pytorch框架和基于深度卷\n积神经网络训练得到的，专门用于进行花朵识别。 对应的标签文件为“ labels.txt ”。该\n模型的使用交互流程为：\n1)加载模型 “flower-detection.onnx ”和加载类别标签 “labels.txt ”；\n2)加载一张本地花朵图片 “flower_test.png ”，并预处理图像；\n3)使用flower-detection模型对花朵图片进行识别；\n4)输出花朵的预测类型和识别的准确率。\n你作为一名人工智能训练师，请完成以下工作任务：\n（1）补全该模型的使用交互流程对应的Python代码（3.2.4.ipynb ），实现本地测试图片\n“flower_test.png ”的识别，将其识别结果截图保存为jpg格式文件，命名为\n3.2.4-1.jpg 。\n（2）在上面的使用交互流程基础上，给出在花朵智能识别系统中使用\n为3.2.4.docx 。\n所有结果文件储存在桌面新建的考生文件夹中，文件夹命名为 “准考证号 +身份证号后六\n位”。\n3.技能要求\n（1）能确保模型在单一场景下稳定运行；\n（2）能通过分析，设计单一场景下人工和智能交互的最优流程。\n4.质量指标\n（1）模型运行稳定，使用正常；\n（2）单一场景下人工和智能交互的最优流程切实可行。\nR6import onnxruntime  as ort\nimport numpy as np\nimport scipy.special\nfrom PIL import  Image\n# 预处理图像\ndef preprocess_image(image, resize_size =256, crop_size =224, mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]):\nimage = image.resize((resize_size , resize_size ), Image.BILINEAR )\nw, h = image.size\nleft = (w - crop_size ) / 2\ntop = (h - crop_size ) / 2\nimage = image.crop((left, top, left + crop_size , top + crop_size ))\nimage = np.array(image).astype(np.float32)\nimage = image / 255.0\nimage = (image - mean) / std\nimage = np.transpose(image, (2, 0, 1))\nimage = image.reshape((1,) + image.shape)\nreturn  image\n# 加载模型2分\nsession = ort.InferenceSession('flower-detection.onnx' )\n# 加载类别标签2分\nwith open('labels.txt' ) as f:\nlabels  = [line.strip() for line in f.readlines()]\n# 获取模型输入和输出的名称\ninput_name  = session.get_inputs()[0].name\noutput_name  = session.get_outputs()[0].name\n# 加载图片2分\nimage = Image.open('flower_test.png' ).convert('RGB')", "scoring": "试题名称：花朵智能识别系统交互流程设计\n考核时间：20min\n测量分评分表细则编\n号配分评分细则描述规定或\n标称值结果或\n实际值得分\nM1 2模型加载代码正确得2分根据数\n据\nM2 2类别标签加载代码正确得2分根据数\n据\nM3 2从指定路径加载图片代码正确得2\n分；根据数\n据\nM4 2预处理图片代码正确得2分；根据数\n据\nM5 2使用模型对图片进行识别代码正确\n得2分；根据数\n据\nM6 2获取识别分类后的准确率代码正确\n得2分；根据数\n据\nM7 2获取预测的类别索引代码正确得2\n分；根据数\n据\nM8 2获取预测的准确值（转换为百分比）\n代码正确得2分；根据数\n据\nM9 2获取预测的类别标签代码正确得2\n分；根据数\n据\nM10 1截图3.2.4-1.jpg中类别和准确率\n正确得1分；根据数\n据\nM11 1人机交互最优流程（不少于3条）\n正确得1分；根据数\n据\n合计配\n分20合计得分\n试题单", "reference": "In [1]:\nR6# 预处理图片2分\nprocessed_image  = preprocess_image(image)\n# 确保输入数据是float32类型\nprocessed_image  = processed_image .astype(np.float32)\n# 进行图片识别2分\noutput = session.run([output_name ], {input_name : processed_image })[0]\n# 应用softmax函数获取识别分类后的准确率2分\naccuracy  = scipy.special.softmax(output , axis=-1)\n# 获取预测的类别索引\npredicted_idx  =  np.argmax(accuracy [0])\n# 获取预测的准确值（转换为百分比）\nprob_percentage  =  accuracy [0, predicted_idx ] * 100\n# 获取预测的类别标签\npredicted_label  = labels [predicted_idx ]\n# 输出预测结果，包含百分比形式的概率\nprint(f\"Predicted class: {predicted_label }, Accuracy: {prob_percentage :.2f}%\")\nPredicted class: daisy, Accuracy: 96.41%\nIn [ ]:\nR6请勿修改答题卷，在指定单元格内填写答案\n人机交互的最优方式（答对3条以上正确得1分）\n1.用户界面设计：提供一个简洁直观的用户界面，方便用户上传图片和查看识\n别结果。\n2)加载模型“flower-detection.onnx”和加载类别标签“labels.txt” ；\n3)加载一张本地花朵图片“flower_test.png” ，并预处理图像；\n4)使用flower-detection模型对花朵图片进行识别；\n5)输出花朵的预测类型和识别的准确率。", "id": 29, "page": 181}, {"name": "人脸AI智能检测系统交互流程设计", "time": "20min", "question": "1.场地设备要求\n（1）人工智能训练师主机1台；\n2.工作任务\n在安防监控、 智能交通等领域，实时准确的人脸检测需求日益增长。 传统的人脸检测\n方法在面对复杂光照 、多角度、遮挡等情况时，检测效果往往不尽人意 。随着深度学习技术\n的发展，基于深度神经网络的人脸检测模型展现出强大的性能优势。 ONNX（OpenNeural\nNetwork Exchange ）作为一种开放式的神经网络交换格式，能够实现不同深度学习框架间的\n模型转换与共享，使得基于ONNX的人脸检测模型可以在多种环境下高效运行 。本系统所\n使用的 “version-RFB-320.onnx ”模型，通过大量数据训练，能够快速准确地检测出图像中\n的人脸，在实际应用场景中具有重要价值。\nAI模型说明： “version-RFB-320.onnx ”模型是用于人脸检测的ONNX格式模型，对\n应的类别标签文件为 “voc-model-labels.txt ”。 该模型的使用交互流程为：\n（1）加载“version-RFB-320.onnx ”模型和 “voc-model-labels.txt ”类别标签；\n（2）加载本地测试图片文件夹 “imgs”中的所有图片，并对每张图片进行预处理以符合模\n型输入要求；\n（3）使用“version-RFB-320.onnx ”模型对加载的图片进行人脸检测；\n（4）在图片上绘制检测到的人脸框，并将处理后的图片保存到 “./detect_imgs_results_onnx ”\n文件夹中；\n（5）统计所有图片中检测到的人脸总数并输出。\n你作为一名人工智能训练师，请完成以下工作任务：\n件夹“imgs”中所有图片的人脸检测，将运行结果截图保存到3.2.5-1.jpg中，并将检测结果\n的图片上传。\n（2）在上面的使用交互流程基础上，结合实际应用场景，设计在人脸检测系统中使用\n“version-RFB-320.onnx ”模型的一种人机交互优化方案，包括交互界面布局 、操作流程等内\n容，将其保存为docx文件，命名为3.2.5.docx 。\n所有结果文件储存在桌面新建的考生文件夹中，文件夹命名为 “准考证号 +身份证号\n后六位 ”。\n3.技能要求\n（1）能确保模型在单一场景下稳定运行；\n（2）能通过分析，找到单一场景下人工和智能交互的最优方式。\n（3）能对单一场景下人工和智能交互界面设计提出优化需求。\n4.质量指标\n（1）模型运行稳定，使用正常；\n（2）单一场景下人工和智能交互的最优方式切实可行。\nR6import os\nimport time\nimport cv2\nimport numpy as np\nimport vision.utils.box_utils_numpy  as box_utils\nimport onnxruntime  as ort\n# 定义预测函数，对模型输出的边界框和置信度进行后处理\ndef predict(width, height , confidences , boxes, prob_threshold , iou_threshold =0.3, top_k=-1):\nboxes = boxes[0]\nconfidences  = confidences [0]\npicked_box_probs  = []\npicked_labels  = []\nfor class_index  in range(1, confidences .shape[1]):\nprobs = confidences [:, class_index ]\nmask = probs > prob_threshold\nprobs = probs[mask]\nif probs.shape[0] == 0:\ncontinue\nsubset_boxes  = boxes[mask, :]\nbox_probs  = np.concatenate([subset_boxes , probs.reshape(-1, 1)], axis=1)\nbox_probs  = box_utils .hard_nms(box_probs ,\niou_threshold =iou_threshold ,\ntop_k=top_k,\n)\npicked_box_probs .append(box_probs )\npicked_labels .extend([class_index ] * box_probs .shape[0])\nif not picked_box_probs :\nreturn np.array([]), np.array([]), np.array([])\npicked_box_probs  = np.concatenate(picked_box_probs )\npicked_box_probs [:, 0] *= width\npicked_box_probs [:, 1] *= height\npicked_box_probs [:, 2] *= width\npicked_box_probs [:, 3] *= height\nreturn  picked_box_probs [:, :4].astype(np.int32), np.array(picked_labels ), picked_box_probs [:, 4]\n# 从标签文件中读取每一行，并去除行首尾的空白字符，得到类别名称列表2分\nclass_names  = [name.strip() for name in open('voc-model-labels.txt' ).readlines()]", "scoring": "试题名称：人脸AI智能检测系统交互流程设计\n考核时间：20min\n测量分评分表细则编\n号配分评分细则描述规定或\n标称值结果或\n实际值得分\nM1 2从标签文件中读取每一行，并去除\n行首尾的空白字符，得到类别名称\n列表代码正确得2分；根据数\n据\nM2 2创建ONNXRuntime的推理会话，\n用于运行模型进行推理代码正确得\n2分；根据数\n据\nM3 2获取模型输入的名称代码正确得2\n分；根据数\n据\nM4 2果保存结果的目录不存在，则创建\n该目录代码得2分；根据数\n据\nM5 2使用OpenCV读取图像文件2分\n代码正确得2分；根据数\n据\nM6 2将图像调整为320x240的尺寸（符\n合模型输入的尺寸要求）代码正确\n得2分；根据数\n据\nM7 2定义图像归一化的均值数组代码正\n确得2分；根据数\n据\nM8 1在第一个维度上扩展一个维度，将\n图像变为 (1,通道数,高度,宽\n度)，以符合模型输入的维度要求代\n码正确得2分；根据数\n据\nM9 2使用ONNXRuntime运行模型，输\n入图像数据，得到模型输出的置信\n度和边界框代码正确得2分；根据数\n据\nM10 1本地保存运行结果的截图\n3.2.5-1.jpg中人脸数量正确：得1\n分；根据数\n据\nM11 1检测结果的图片中人脸标注框和数\n量都正确得1分；根据数\n据\nM12 1人机交互最优流程（不少于3条）\n正确得1分；根据数\n据\n合计配\n分20合计得分\n试题单", "reference": "In [12]:\nR6# 创建ONNX Runtime的推理会话，用于运行模型进行推理2分\nort_session  = ort.InferenceSession('version-RFB-320.onnx' )\n# 获取模型输入的名称2分\ninput_name  = ort_session .get_inputs()[0].name\n# 定义保存检测结果图像的目录路径\nresult_path  = \"./detect_imgs_results_onnx\"\n# 定义置信度阈值，用于筛选出置信度较高的检测结果\nthreshold  = 0.7\n# 定义存储待检测图像的目录路径\npath = \"imgs\"\n# 用于统计所有图像中检测到的目标框总数，初始化为0\nsum = 0\n# 如果保存结果的目录不存在，则创建该目录2分\nif not os.path.exists(result_path ):\nos.makedirs(result_path )\n# 获取指定目录下的所有文件和文件夹名称列表\nlistdir = os.listdir(path)\n# 遍历目录下的每个文件\nfor file_path  in listdir:\n# 拼接图像文件的完整路径\nimg_path  = os.path.join(path, file_path )\n# 使用OpenCV读取图像文件2分\norig_image  = cv2.imread(img_path )\n# 将图像从BGR颜色空间转换为RGB颜色空间（许多模型要求输入为RGB格式）\nimage = cv2.cvtColor(orig_image , cv2.COLOR_BGR2RGB )\n# 将图像调整为320x240的尺寸（符合模型输入的尺寸要求）2分\nimage = cv2.resize(image, (320, 240))\n# 定义图像归一化的均值数组2分\nimage_mean  = np.array([127, 127, 127])\n# 对图像进行归一化处理，减去均值并除以128\nimage = (image - image_mean ) / 128\n# 将图像的维度从  (高度, 宽度, 通道数 )转换为  (通道数 , 高度, 宽度)\nimage = np.transpose(image, [2, 0, 1])\n# 在第一个维度上扩展一个维度，将图像变为  (1, 通道数, 高度, 宽度)，以符合模型输入的维度要求1分\nimage = np.expand_dims(image, axis=0)\nR6    # 将图像数据类型转换为float32类型\nimage = image.astype(np.float32)\n# 记录开始时间，用于计算模型推理的耗时\ntime_time  = time.time()\n# 使用ONNX Runtime运行模型，输入图像数据，得到模型输出的置信度和边界框2分\nconfidences , boxes = ort_session .run(None, {input_name : image})\n# 计算并打印模型推理的耗时\nprint(\"cost time: {}\".format(time.time() - time_time ))\n# 调用predict函数对模型输出的边界框和置信度进行后处理，得到最终的边界框、类别标签和置信度\nboxes, labels , probs = predict(orig_image .shape[1], orig_image .shape[0], confidences , boxes, threshold )\n# 遍历每个检测到的目标框\nfor i in range(boxes.shape[0]):\n# 获取当前目标框的坐标\nbox = boxes[i, :]\n# 生成当前目标框的标签字符串，包含类别名称和置信度\nlabel = f\"{class_names [labels[i]]}: {probs[i]:.2f}\"\n# 在原始图像上绘制目标框，颜色为  (255, 255, 0) ，线条粗细为4\ncv2.rectangle(orig_image , (box[0], box[1]), (box[2], box[3]), (255, 255, 0), 4)\n# 将绘制了目标框的图像保存到结果目录中\ncv2.imwrite(os.path.join(result_path , file_path ), orig_image )\n# 累加当前图像中检测到的目标框数量到总数中\nsum += boxes.shape[0]\n# 打印所有图像中检测到的目标框总数\nprint(\"sum:{}\".format(sum))\ncost time:0.007998943328857422\nsum:4\nIn [ ]:\nR6请勿修改答题卷，在指定单元格内填写答案\n人机交互的最优方式（答对3条以上正确得1分）\n1.用户界面设计：提供一个简洁直观的用户界面，方便用户上传图片和查看识\n别结果。\n（2）加载“version-RFB-320.onnx” 模型和“voc-model-labels.txt” 类\n别标签；\n（3）加载本地测试图片文件夹 “imgs” 中的所有图片，并对每张图片进行\n预处理以符合模型输入要求；\n（4）使用 “version-RFB-320.onnx” 模型对加载的图片进行人脸检测；\n（5）在图片上绘制检测到的人脸框，并将处理后的图片保存到\n“./detect_imgs_results_onnx” 文件夹中；\n（6）统计所有图片中检测到的人脸总数并输出。", "id": 30, "page": 187}, {"name": "Labelstudio培训大纲编写", "time": "10min", "question": "1.场地设备要求\n（1）人工智能训练师主机；\n（2）Office软件。\n2.工作任务\nA企业是一家康复训练机构，需要利用人工智能技术为康复患者提供个性化的康复训练计\n划，并实时监控训练效果 。为了提高人工智能技术的应用效果，现计划对新进技术人员进行\n数据标注的培训。 这次培训，将会使新进技术人员掌握Labelstudio标注工具的使用，能\n对文本、 图像、 视频、 音频进行标注，达到人工智能训练师五级 /初级工的技能水平。\n请你根据要求补全素材4.1.1.docx中的培训大纲。\n3.技能要求\n（1）能编写初级培训讲义；\n（2）能对初级工、 中级工开展知识和技术培训；\n4.质量指标\n（1）培训讲义编写逻辑合理；\n（2）培训资料正确有效；\n（3）语句组织通顺。\nR6在下划线上填写答案。\n根据学习大纲补充学习目标\n引言\n学习目标：了解数据标注的重要性和应用场景。\n内容：\n介绍人工智能在康复训练中的应用，数据标注在个性化康复训练计划中的作用。\n数据标注基础理论\n学习目标：理解数据标注的概念及其在不同类型数据中的应用和重要性。内容：\n什么是数据标注？\n数据标注的类型：文本、 图像、 视频、 音频。\n数据标注在人工智能中的作用和重要性。\nLabelStudio简介与安装\n学习目标：掌握LabelStudio的安装配置方法及其基本操作和应用场景。内容：\nLabelStudio简介及应用场景。\n安装与配置LabelStudio。\nLabelStudio界面介绍和基本操作。\n文本数据标注\n学习目标：学会使用LabelStudio进行文本数据标注方法内容：\n文本标注类型：命名实体识别、 情感分析等。\nLabelStudio文本标注功能演示。\n实践操作：标注一个文本数据集。\n图像数据标注\n学习目标：掌握使用LabelStudio对图像进行标注方法和技巧。内容：\n图像标注类型：图像分类、 目标检测、 图像分割等。\nLabelStudio图像标注功能演示。\n实践操作：标注一个图像数据集。\n视频数据标注\n学习目标：能够运用LabelStudio完成视频数据标注方法和技巧。内容：\n视频标注类型：动作识别、 事件检测等。\nLabelStudio视频标注功能演示。\nR6实践操作：标注一个视频数据集。\n音频数据标注\n学习目标：掌握音频数据标注的方法和技巧。\n内容：\n音频标注类型：语音识别、 情感分析等。\nLabelStudio音频标注功能演示。\n实践操作：标注一个音频数据集。\n综合项目实践\n学习目标：综合运用所学知识进行数据标注项目。\n内容：\n项目介绍：为康复训练项目进行多模态数据标注（包括文本、 图像、视频、音频）。\n数据标注：学员分组进行实际数据标注任务。\n项目评审：展示标注成果，讲解标注思路和遇到的问题。\n总结与答疑\n学习目标：巩固所学内容，解决学员疑问。\n内容：培训内容总结，关键点回顾，学员提问与解答。\n评估测试\n学习目标：评估学员掌握的数据标注技能。\n内容：\n理论测试：关于数据标注基本概念和LabelStudio使用的笔试。\n实操测试：要求学员完成指定的数据标注任务。", "scoring": "试题名称：Labelstudio培训大纲编写\n考核时间：10min\n测量分评分表细则编\n号配分评分细则描述规定或\n标称值结果或\n实际值得分\nM1 5回答内容与答案类似得1分；最多\n5分；根据数\n据\n合计配\n分5合计得分\n试题单", "reference": "", "id": 31, "page": 194}, {"name": "爬虫培训大纲编写", "time": "10min", "question": "1.场地设备要求\n（1）人工智能训练师主机；\n（2）Office软件。\n2.工作任务\nA企业是一家互联网金融机构，需要利用人工智能技术获取大量上市公司的财务报告 。为了\n提高获取效率，现计划对新进技术人员进行网页爬虫工具的使用培训 。通过这次培训，将会\n使新进技术人员掌握常用网页爬虫工具的使用，能对网络公开的上市公司财务报告进行获\n取，达到人工智能训练师四级 /中级工的技能水平。\n请你根据要求补全素材4.1.2.docx中的培训大纲。\n3.技能要求\n（1）能编写初级培训讲义；\n（2）能对初级工、 中级工开展知识和技术培训；\n4.质量指标\n（1）培训讲义编写逻辑合理；\n（2）培训资料正确有效；\n（3）语句组织通顺。\nR6在下划线上填写答案。\n根据学习大纲补充学习目标\n引言\n学习目标：了解网页爬虫的重要性和应用场景。\n内容：\n介绍人工智能在金融数据采集中的应用，网页爬虫在获取上市公司财务报告中的作用。\n网页爬虫基础理论\n学习目标：理解网页爬虫的概念、 工作流程及基本结构，并学会遵守robots.txt协议。\n内容：\n什么是网页爬虫？\n网页爬虫的工作流程和基本结构。\n机器人协议（robots.txt ）的作用和遵守方法。\n常用网页爬虫工具简介\n学习目标：熟悉常用网页爬虫工具的基本功能及其适用场景。内容：\nBeautifulSoup ：用于解析HTML和XML文档。\nScrapy：一个快速、 高效的网页爬虫框架。\nSelenium ：用于模拟浏览器操作，处理动态网页。\n环境搭建与工具安装\n学习目标：掌握网页爬虫工具的安装和环境配置。\n内容：\n安装Python和pip包管理工具。\n安装并配置BeautifulSoup 、Scrapy、Selenium 。\n网页数据解析\n学习目标：学会使用网页数据解析的方法与技术内容：\n使用BeautifulSoup进行HTML解析。\n使用XPath和CSS选择器提取数据。\n实践操作：解析一个简单的网页数据。\n动态网页处理\n学习目标：掌握处理动态网页的方法。\n内容：\n使用Selenium模拟浏览器操作。\n处理动态加载的数据，如Ajax请求。\nR6实践操作：爬取一个动态加载的网页数据。\nScrapy框架实战\n学习目标：能够创建并配置Scrapy项目并综合运用\n内容：\nScrapy项目的创建和基本配置。\n编写爬虫脚本，设置抓取规则。\n数据存储与导出：将数据保存为CSV、JSON等格式。\n实践操作：构建一个Scrapy爬虫项目，获取上市公司财务报告。\n数据清洗与处理\n学习目标：掌握数据清洗和处理的方法与技术内容：\n数据去重、 缺失值处理。\n数据格式转换与规范化。\n实践操作：对获取的财务报告数据进行清洗和处理。\n综合项目实践\n学习目标：综合运用所学知识进行网页爬虫项目。\n内容：\n项目介绍：构建一个完整的财务报告爬虫项目。\n数据采集：获取多个网站的财务报告数据。\n数据处理与分析：清洗并分析获取的数据。\n项目评审：展示爬虫成果，讲解实现思路和遇到的问题。\n总结与答疑\n学习目标：巩固所学内容，解决学员疑问。\n内容：培训内容总结，关键点回顾，学员提问与解答。\n评估测试\n学习目标：评估学员掌握的网页爬虫技能。\n内容：\n理论测试：关于网页爬虫基本概念和工具使用的笔试。\n实操测试：要求学员完成指定的网页爬虫任务。", "scoring": "试题名称：爬虫培训大纲编写\n考核时间：10min\n测量分评分表细则编\n号配分评分细则描述规定或\n标称值结果或\n实际值得分\nM1 5回答内容与答案类似得1分；最多\n5分；根据数\n据\n合计配\n分5合计得分\n试题单", "reference": "", "id": 32, "page": 198}, {"name": "数据清洗培训大纲编写", "time": "10min", "question": "1.场地设备要求\n（1）人工智能训练师主机；\n（2）Office软件。\n2.工作任务\nA企业是一家康复训练机构，需要利用人工智能技术为康复患者提供个性化的康复训练计\n划，并实时监控训练效果。 为了提高人工智能技术的应用效果，其采集了大量的康复数据，\n现计划对新进技术人员进行数据清洗工具的使用培训。 通过这次培训，将会使新进技术人员\n掌握4中基于Python的数据清洗工具的使用，能对大量的康复数据进行清洗，达到人工智\n能训练师四级 /中级工的技能水平。\n请你根据要求补全素材4.1.3.docx中的培训大纲。\n3.技能要求\n（1）能编写初级培训讲义；\n（2）能对初级工、 中级工开展知识和技术培训。\n4.质量指标\n（1）培训讲义编写逻辑合理；\n（2）培训资料正确有效；\n（3）语句组织通顺。\nR6在下划线上填写答案。\n根据学习大纲补充学习目标\n引言\n学习目标：掌握数据清洗的方法和技术并理解在康复数据中的作用\n内容：\n介绍人工智能在康复训练中的应用，数据清洗在处理康复数据中的作用。\n数据清洗基础理论\n学习目标：理解数据清洗的基本概念和任务。\n内容：\n什么是数据清洗？\n数据清洗的常见任务：数据去重、 缺失值处理、 数据格式转换等。\n数据清洗在数据分析和模型训练中的重要性。\n常用数据清洗工具简介\n学习目标：认识Pandas、 NumPy、OpenRefine和Dask等工具内容：\nPandas：强大的数据处理与分析工具。\nNumPy：高性能科学计算和数据处理库。\nOpenRefine ：用于数据清洗的开源工具。\nDask：用于处理大规模数据的并行计算库。\n环境搭建与工具安装\n学习目标：掌握Python及常用数据清洗工具的安装配置\n内容：\n安装Python和pip包管理工具。\n安装并配置Pandas、NumPy、OpenRefine 、Dask。\nPandas实战\n学习目标：会使用Pandas进行数据导入、 筛选和转换\n内容：\n数据导入与导出：读取和保存CSV、Excel等格式的数据。\n数据筛选与过滤：条件筛选、 去重、 缺失值处理。\n数据转换：数据类型转换、 时间序列处理。\n实践操作：使用Pandas清洗一个康复数据集。\nNumPy实战\n学习目标：综合运用所学知识进行数据清洗项目。\n内容：\n项目介绍：清洗一个多来源、 多格式的康复数据集。\nR6数据采集：导入多种格式的数据。\n数据清洗：使用Pandas、NumPy、OpenRefine 、Dask进行清洗。\n项目评审：展示清洗成果，讲解实现思路和遇到的问题。", "scoring": "试题名称：数据清洗培训大纲编写\n考核时间：10min\n测量分评分表细则编\n号配分评分细则描述规定或\n标称值结果或\n实际值得分\nM1 5回答内容与答案类似得1分；最多\n5分；根据数\n据\n合计配\n分5合计得分\n试题单", "reference": "", "id": 33, "page": 202}, {"name": "Pandas数据清洗培训大纲编写", "time": "10min", "question": "1.场地设备要求\n（1）人工智能训练师主机；\n（2）Office软件。\n2.工作任务\nA企业是一家康复训练机构，需要利用人工智能技术为康复患者提供个性化的康复训练计\n划。为了提高人工智能技术的应用效果，其采集了大量的康复数据，现计划对新进技术人员\n进行数据清洗工具的使用培训 。因为Pandas是Python中最为广泛使用的数据分析和操作库\n之一，因此这次培训将使新进技术人员掌握Pandas的主要数据清洗功能使用，能对大量的\n康复数据进行清洗，达到人工智能训练师四级 /中级工的技能水平。\n请你根据要求补全素材4.1.4.docx中的培训大纲。\n3.技能要求\n（1）能编写初级培训讲义；\n（2）能对初级工、 中级工开展知识和技术培训。\n4.质量指标\n（1）培训讲义编写逻辑合理；\n（2）培训资料正确有效；\n（3）语句组织通顺。\nR6在下划线上填写答案。\n根据学习大纲补充学习目标\n数据清洗基础理论\n学习目标：掌握数据清洗的基本概念和流程。\n内容：\n什么是数据清洗？\n数据清洗的常见任务：数据去重、 缺失值处理、 数据格式转换等。\n数据清洗在数据分析和模型训练中的重要性。\nPandas简介与安装\n学习目标：学会使用Pandas读取和保存不同格式的数据。内容：\n读取CSV、Excel、SQL等格式的数据。\n保存数据到CSV、Excel等格式。\n实践操作：导入和导出康复数据集。\n数据筛选与过滤\n学习目标：掌握基于条件筛选、 去重及处理缺失值的方法。\n内容：\n条件筛选：基于单列或多列的条件筛选数据。\n数据去重：去除重复记录。\n缺失值处理：识别、 删除和填充缺失值。\n实践操作：筛选和过滤康复数据。\n数据转换\n学习目标：学会进行数据类型转换、 时间序列处理及数据列的分割与合并。内容：\n数据类型转换：转换数据类型（如字符串到日期） 。\n时间序列处理：处理和分析时间序列数据。\n数据分列和合并：分割和合并数据列。\n实践操作：转换和处理康复数据。\n数据合并与重塑\n学习目标：掌握数据合并及重塑的方法内容：\n数据合并：concat和merge方法。\n数据重塑：pivot和melt方法。\n实践操作：合并和重塑康复数据。\n数据分组与聚合\nR6学习目标：能够使用groupby方法对数据进行分组，并应用聚合函数进行数据\n分析。\n内容：\n数据分组：groupby方法。\n聚合函数：sum、mean、count等。\n实践操作：分组和聚合康复数据。\n数据可视化\n学习目标：综合运用所学知识进行数据清洗项目。\n内容：\n项目介绍：清洗一个多来源的康复数据集。\n数据采集：导入多种格式的数据。\n数据清洗：使用Pandas进行数据清洗和转换。\n项目评审：展示清洗成果，讲解实现思路和遇到的问题。", "scoring": "试题名称：Pandas数据清洗培训大纲编写\n考核时间：10min\n测量分评分表细则编\n号配分评分细则描述规定或\n标称值结果或\n实际值得分\nM1 5回答内容与答案类似得1分；最多\n5分；根据数\n据\n合计配\n分5合计得分\n试题单", "reference": "", "id": 34, "page": 206}, {"name": "Python数据可视化培训大纲编写", "time": "10min", "question": "1.场地设备要求\n（1）人工智能训练师主机；\n（2）Office软件。\n2.工作任务\nA企业是一家康复训练机构，需要利用人工智能技术为康复患者提供个性化的康复训练计\n划，并实时监控训练效果。 为了提高人工智能技术的应用效果，其采集了大量的康复数据，\n现计划对新进技术人员进行数据可视化工具的使用培训 。通过这次培训，将会使新进技术人\n员掌握Python的数据可视化工具的使用，能对重要数据进行可视化操作，达到人工智能训\n练师四级 /中级工的技能水平。\n请你根据要求补全素材4.1.5.docx中的培训大纲。\n3.技能要求\n（1）能编写初级培训讲义；\n（2）能对初级工、 中级工开展知识和技术培训。\n4.质量指标\n（1）培训讲义编写逻辑合理；\n（2）培训资料正确有效；\n（3）语句组织通顺。\nR6在下划线上填写答案。\n根据学习大纲补充学习目标\n数据可视化基础理论\n学习目标：理解数据可视化的概念、 目的及其优势，并了解常见的数据可视化类\n型。\n内容：\n什么是数据可视化？\n数据可视化的目的和优势。\n常见的数据可视化类型：条形图、 折线图、 散点图、 饼图等。\nMatplotlib简介与安装\n学习目标：了解Matplotlib的基本功能及其应用场景，并掌握其安装和配置方法。\n内容：\nMatplotlib简介及其应用场景。\n安装与配置Matplotlib库。\nMatplotlib基本构架与常用组件。\nMatplotlib基本绘图\n学习目标：学会使用Matplotlib创建简单图表并进行定制化设置。\n内容：\n创建简单图表：折线图、 条形图、 饼图。\n图表定制：标题、 轴标签、 图例、 颜色等。\n实践操作：使用Matplotlib绘制康复数据的基本图表。\nPlotly简介与安装\n学习目标：熟悉Plotly的功能及其应用场景，并能正确安装和配置该库内容：\nPlotly简介及其应用场景。\n安装与配置Plotly库。\nPlotly与Jupyter Notebook的结合使用。\nPlotly交互式绘图\n学习目标：掌握使用Plotly创建交互式图表的方法及其交互功能的应用。内容：\n创建交互式图表：折线图、 散点图、 饼图、 地理图表。\n图表交互功能：缩放、 平移、 悬停显示。\n实践操作：使用Plotly绘制交互式康复数据图表。\n数据可视化项目实战\nR6学习目标：综合运用所学知识进行数据可视化项目。\n内容：\n项目介绍：对康复数据进行可视化分析。\n数据采集与预处理：导入并清洗康复数据。\n数据可视化：使用Matplotlib 、Seaborn、Plotly进行可视化分析。\n项目评审：展示可视化成果，讲解实现思路和遇到的问题。\n总结与答疑\n学习目标：巩固所学内容，解决学员疑问。\n内容：培训内容总结，关键点回顾，学员提问与解答。\n评估测试\n学习目标：评估学员掌握的数据可视化技能。\n内容：\n理论测试：关于数据可视化基本概念和工具使用的笔试。\n实操测试：要求学员完成指定的数据可视化任务。", "scoring": "试题名称：Python数据可视化培训大纲编写\n考核时间：10min\n测量分评分表细则编\n号配分评分细则描述规定或\n标称值结果或\n实际值得分\nM1 5回答内容与答案类似得1分；最多\n5分；根据数\n据\n合计配\n分5合计得分\n试题单", "reference": "", "id": 35, "page": 210}, {"name": "智能零售分析系统数据采集和处理指导", "time": "10min", "question": "1.场地设备要求\n人工智能训练师主机：CPU（inteli5及以上）、内存（不少于16GB）、操作系统（windows10 ）、\n办公软件；\n2.工作任务\n在快速发展的零售行业中，商家面临着巨大的竞争压力，需要精准地了解消费者行为 、\n优化库存管理 、预测销售趋势以及提升顾客体验 。为了应对这些挑战，某大型连锁超市决定\n部署一套智能零售分析系统，该系统将利用人工智能和大数据分析来提升其业务效率和客户\n满意度。\n智能零售分析系统的目标包括：\n提高销售转化率和客户忠诚度。\n减少库存成本，避免滞销和断货。\n降低运营成本，提高供应链效率。\n加强市场竞争力，快速响应市场变化。\n智能零售分析系统的业务需求包括：\n顾客行为分析：收集顾客购物习惯、 偏好和购买频率，以便于定制个性\n化营销策略。\n库存优化：实时监测货架上的商品存量，预测补货需求，减少过度库存\n和缺货情况。\n销售预测：基于历史销售数据和市场趋势，预测未来销售，辅助决策。\n动态定价：根据供需关系、 竞争对手价格变动等因素，动态调整商品价\n客户满意度提升：通过分析顾客反馈和评论，识别服务短板，改进服务\n质量。\n你作为一名人工智能训练师，根据上述的智能零售分析系统的系统目标和业务需求，\n补全智能零售分析系统的数据采集和处理指导方案（见素材文件夹中的4.2.1.docx）。\n所有结果文件储存在桌面新建的考生文件夹中，文件夹命名为 “准考证号 +身份证号后\n六位”。\n3.技能要求\n（1）能指导五级 /初级工、 四级 /中级工解决数据采集、 处理问题\n（2）能指导五级 /初级工、 四级 /中级工优化数据采集、 处理问题\n4.质量指标\n（1）数据采集和处理的指导方案内容合理、 可行；\n（2）数据采集全面；\n（3）数据处理准确与完整。\nR6在下划线上填写答案，请勿修改其他内容。\n智能零售分析系统数据采集和处理指导方案\n1.数据源确定\n销售点（POS）数据：从收银系统获取交易记录，包括商品种类、 数量、 价格和购\n买时间。\n顾客信息：会员卡使用数据，包括会员基本信息、 消费记录和积分兑换 。\n库存管理系统：实时库存量、 入库和出库记录。\n顾客反馈：在线评价、 投诉和建议。\n外部数据：天气预报、 节假日信息、 竞争对手价格数据。\n2.数据采集方法\nAPI接口：与内部系统（如POS、CRM）和外部数据提供商建立API连接，自动化数\n据抓取。\n传感器和物联网设备：在货架上安装RFID标签和重量传感器，监测商品存量。\n社交媒体监听：通过社交媒体API监听品牌相关的公众讨论和评价。\n顾客调查：定期发送电子问卷，收集顾客反馈。\n3.数据预处理\n清洗：去除重复、 错误或无关的数据项 。\n标准化：统一数据格式，例如日期和时间的表示方式 。\n整合：将来自不同来源的数据合并到单一数据库中，创建关联字段。\n4.数据安全与合规\n加密传输：确保数据在传输过程中的安全。\n访问控制：限制对敏感数据的访问权限，只允许授权人员查看。\n匿名化处理：对个人信息进行去标识化，遵守GDPR等数据保护法规。\n5.数据存储与管理\n云存储：选择可靠的云服务商，如AWS或Azure，存储海量数据。\n备份与恢复：定期备份数据，并测试恢复流程，以防数据丢失。\n6.数据分析与应用\n建模：使用机器学习算法预测销售趋势、 顾客偏好和库存需求 。\n可视化：开发仪表板展示关键指标，帮助管理层做出决策。\n报告：定期生成销售、 库存和顾客满意度报告，提供业务洞察。\n通过上述方案，智能零售分析系统能够有效地采集 、处理和分析大量数据，为企业\n提供决策支持，最终达到提升业务效率和顾客满意度的目标。", "scoring": "试题名称：智能零售分析系统数据采集和处理指导\n考核时间：10min\n测量分评分表细则编\n号配分评分细则描述规定或\n标称值结果或\n实际值得分\nM1 5正确补充方案内容的每1个内容点\n得1分，总计得5分；根据数\n据\n第1个内容点正确，得1分\n第2个内容点正确，得1分\n第3个内容点正确，得1分\n第4个内容点正确，得1分\n第5个内容点正确，得1分\n合计配\n分5合计得分\n试题单", "reference": "", "id": 36, "page": 214}, {"name": "AI辅助的医疗影像诊断系统数据采集和处理指导", "time": "10min", "question": "1.场地设备要求\n人工智能训练师主机：CPU（inteli5及以上）、内存（不少于16GB）、操作系统（windows10 ）、\n办公软件；\n2.工作任务\n随着医疗科技的进步，AI在医疗影像诊断领域的应用日益广泛 。AI辅助的医疗影像诊\n断系统能够通过深度学习技术，分析X射线、CT、MRI等医学影像，帮助医生更快速 、更准\n确地识别病灶，评估病情，尤其在早期癌症筛查 、骨伤评估 、神经系统疾病诊断等方面展现\n出巨大潜力 。这种系统不仅提高了诊断效率，降低了误诊率，还为偏远地区或医疗资源匮乏\n的地方提供了高水平的医疗影像分析服务。\nAI辅助的医疗影像诊断系统的目标包括：\n提高诊断准确率：利用AI技术，辅助医生识别细微的病灶特征，减少漏\n诊和误诊；\n加速诊断流程：自动化分析影像，缩短医生等待影像分析结果的时间，\n加快治疗进程；\n个性化诊疗方案：基于AI分析的结果，为患者提供更为精准的个性化治\n疗建议；\n医疗资源均衡分配：通过远程诊断，协助基层医疗机构提高诊疗水平，\n缩小城乡医疗差距；\n你作为一名人工智能训练师，根据上述的AI辅助的医疗影像诊断系统的系统目标，补\n全AI辅助的医疗影像诊断系统的数据采集和处理指导方案（见素材文件夹中4.2.2.docx）。\n六位”。\n3.技能要求\n（1）能指导五级 /初级工、 四级 /中级工解决数据采集、 处理问题\n（2）能指导五级 /初级工、 四级 /中级工优化数据采集、 处理问题\n4.质量指标\n（1）数据采集和处理的指导方案内容合理可行；\n（2）确保医疗影像数据采集完整和准确性；\n（3）统一数据格式和标准化处理流程。\nR6AI辅助的医疗影像诊断系统数据采集和处理指导方案\n1.数据采集方案\n医学影像获取：确保影像质量，使用高分辨率的医疗设备获取清晰的影像资料，涵\n盖多种疾病类型和人群。\n患者信息收集：在符合HIPAA等隐私保护法规的前提下，收集患者的病史、 年龄 、\n性别等基本信息，以及相关的实验室检查结果。\n___医学影像数据标注 ______________________ ：邀请经验丰富的医生对影像进行\n标注，标记病灶位置、 类型、 大小等关键信息，作为训练AI模型的标注数据集。\n数据脱敏处理：对收集的患者信息进行脱敏处理，确保患者隐私安全。\n2.数据处理方案\n数据清洗与预处理： ___去除重复值、 填补缺失值、 删除异常值\n_____________________ 。\n模型训练与验证： ___选择合适的深度学习模型，并验证其性能 ______。\n模型测试与优化： __使用测试机进行测试并优化 _____。\n系统集成与部署：将训练好的模型集成到医疗影像诊断系统中，部署在医院的服务\n器上，确保医生可以随时调用AI分析结果。\n3.数据安全与隐私保护\n所有数据传输和存储过程都需加密，防止数据泄露。\n遵守HIPAA等隐私法规，确保患者信息不被非法访问或滥用。\n使用数据脱敏技术，如差分隐私，保护患者身份不被识别。\n4.系统优化与升级\n定期收集医生和患者的反馈，评估系统性能，根据实际需求调整AI模型。\n不断更新训练数据集，加入新的疾病类型或变异特征，提高__模型诊断的泛化能力\n_____。\n跟踪AI技术的最新进展，适时引入更先进的算法，提升系统性能。", "scoring": "试题名称：AI辅助的医疗影像诊断系统数据采集和处理指导\n考核时间：10min\n测量分评分表细则编\n号配分评分细则描述规定或\n标称值结果或\n实际值得分\nM1 5正确补充方案内容的每1个内容点\n得1分，总计得5分；根据数\n据\n第1个内容点正确，得1分\n第2个内容点正确，得1分\n第3个内容点正确，得1分\n第4个内容点正确，得1分\n第5个内容点正确，得1分\n合计配\n分5合计得分\n试题单", "reference": "", "id": 37, "page": 218}, {"name": "AI智能安防监控系统采集和处理指导", "time": "10min", "question": "1.场地设备要求\n人工智能训练师主机：CPU（inteli5及以上）、内存（不少于16GB）、操作系统（windows10 ）、\n办公软件；\n2.工作任务\n在现代社会，公共安全和个人隐私保护成为人们日益关注的焦点。 AI智能安防监控系\n统利用计算机视觉 、深度学习和大数据分析技术，能够在公共场所 、住宅区、企业园区等场\n景下，实时监测异常行为，预警潜在威胁，同时保护正常活动的隐私不受侵犯。 系统通过摄\n像头捕捉视频流，利用AI算法分析人物行为、 车辆移动、 物品遗留等情况，自动识别可疑\n活动，如闯入禁区 、夜间徘徊 、暴力冲突等，并及时通知安保人员，有效提升安全管理水平 。\nAI智能安防监控系统的目标包括：\n实时监测与异常行为识别：通过视频分析，即时发现并标记异常行为，\n减少人工监控的盲点。\n隐私保护：在识别异常行为的同时，确保普通人的日常活动不被过度关\n注，尊重个人隐私。\n快速响应：一旦发现紧急情况，立即触发警报，通知相关人员或机构，\n加快响应速度。\n数据分析与报告：对监控数据进行长期分析，为安全策略的制定和优化\n提供数据支持。\n你作为一名人工智能训练师，根据上述的AI智能安防监控系统的目标，补全AI智能\n安防监控系统的数据采集和处理指导方案（见素材文件夹中的4.2.3.docx）。\n六位”。\n3.技能要求\n（1）能指导五级 /初级工、 四级 /中级工解决数据采集、 处理问题\n（2）能指导五级 /初级工、 四级 /中级工优化数据采集、 处理问题\n4.质量指标\n（1）数据采集和处理的指导方案内容合理可行；\n（2）确保智能安防监控数据采集完整和准确性；\n（3）统一数据格式和标准化处理流程。\nR6AI智能安防监控系统采集和处理指导方案\n1.数据采集方法\n高清视频流采集：部署高清摄像头，确保视频画面清晰，便于AI算法识别细节。\n多角度覆盖：合理布置摄像头，确保 _____监控区域 ____无死角，覆盖所有入口、\n出口和敏感区域。\n夜间与低光环境适应：使用带有红外夜视功能的摄像头，保证夜间或低光条件下仍\n能捕捉到清晰图像。\n数据传输与存储：采用稳定的数据传输网络，确保视频流的实时传输，同时建立安\n全的____存储系统 ____，保存原始视频和分析结果。\n2.数据处理方案\n视频流预处理： __对视频流进行去噪，视频压缩。 __。\n行为分析与异常检测： _用深度学习算法对视频中的目标进行检测、 跟踪和行为预\n测，一旦有异常，立即记录并出发响应_ 。\n隐私保护算法：在不影响异常行为识别的前提下，对视频中无关个体进行模糊处理，\n保护个人隐私。\n数据融合与决策支持：结合多个摄像头的数据，进行空间和时间上的数据融合，构\n建更全面的场景理解，为安全决策提供依据。\n3.系统优化与安全措施\n算法优化：持续训练和优化AI模型，提升 __异常行为识别的准确率和速度 __。\n隐私合规：确保系统设计和运营遵守GDPR、CCPA等数据保护法规，定期进行隐私\n影响评估。\n安全防护：实施数据加密 、访问控制和防火墙等安全措施，防止数据泄露和系统被\n攻击。", "scoring": "试题名称：AI智能安防监控系统采集和处理指导\n考核时间：10min\n测量分评分表细则编\n号配分评分细则描述规定或\n标称值结果或\n实际值得分\nM1 5正确补充方案内容的每1个内容点\n得1分，总计得5分；根据数\n据\n第1个内容点正确，得1分\n第2个内容点正确，得1分\n第3个内容点正确，得1分\n第4个内容点正确，得1分\n第5个内容点正确，得1分\n合计配\n分5合计得分\n试题单", "reference": "", "id": 38, "page": 222}, {"name": "自动驾驶汽车感知系统数据采集与标注指导", "time": "10min", "question": "1.场地设备要求\n人工智能训练师主机：CPU（inteli5及以上）、内存（不少于16GB）、操作系统（windows10 ）、\n办公软件；\n2.工作任务\n随着自动驾驶技术的不断进步，汽车行业正向着更高的自动化水平迈进。 自动驾驶汽\n车的感知系统是实现这一目标的关键技术之一，它通过各种传感器（如摄像头 、雷达、激光\n雷达等）收集环境信息，然后通过AI算法处理这些数据，使车辆能够识别周围的障碍物、\n道路状况、 交通标志等，从而做出安全的驾驶决策。 为了训练这些AI算法，需要大量高质\n量的标注数据，以确保自动驾驶汽车在各种驾驶环境下都能够准确地感知和理解环境。\n自动驾驶汽车感知系统的业务需求包括：\n数据多样性：系统需要收集覆盖各种天气条件、 不同时间、 不同地域以\n及各种驾驶场景的数据，以确保AI模型的泛化能力。\n高精度标注：对收集到的数据进行精细标注，包括但不限于车辆、 行人、\n自行车、 动物、 交通标志、 车道线、 红绿灯等。\n实时数据处理：系统应能实时接收和处理来自车辆传感器的数据流，以\n支持即时的决策制定。\n数据安全性：确保数据在采集、 传输和存储过程中的安全性，遵守相关\n数据保护法规。\n高效数据管理：提供数据检索、 数据集构建、 数据清洗和数据版本控制\n等功能，以支持数据科学家和工程师的工作。\n的道路环境和交通规则。\n你作为一名人工智能训练师，根据上述的自动驾驶汽车感知系统的业务需求，补全自\n动驾驶汽车感知系统的数据采集和数据标注指导方案（见素材文件夹中的4.2.4.docx）。\n所有结果文件储存在桌面新建的考生文件夹中，文件夹命名为 “准考证号 +身份证号后\n六位”。\n3.技能要求\n（1）能指导五级 /初级工、 四级 /中级工解决数据采集问题\n（2）能指导五级 /初级工、 四级 /中级工解决数据标注问题\n（3）能指导五级 /初级工、 四级 /中级工优化数据采集、 数据标注问题\n4.质量指标\n（1）数据采集和标注的指导方案内容合理可行；\n（2）确保数据采集和标注的完整和准确性；\nR6自动驾驶汽车感知系统数据采集与标注指导方案\n1.数据采集方案\n多传感器融合：_集成摄像头 、雷达、激光雷达等不同传感器的数据 ,实现知识互补\n____。\n场景覆盖： __.采集涵盖城市道路、 高速公路、 乡村道路等不同道路的数据，覆盖\n白天、 夜晚、 雨雪天、 黎明、 黄昏等天气和时段，增强在各场景下的适应能力 _。\n事件触发采集：在特定事件发生时（如紧急刹车、 避让行动），自动触发额外数据\n采集，以捕获关键时刻。\n数据质量控制： __及时检查传感器的工作状态和数据的完整性、 准确性_ 。\n数据加密与传输：采用安全的数据传输协议，确保数据在传输过程中的安全性。\n2.数据标注方案\n定义标注标准：明确标注类别、 边界框精度要求、 遮挡处理规则等。\n选择标注工具：使用专业的数据标注软件，支持2D框、3D框、语义分割等标注类\n型。\n__标注人员培训 _：对标注员进行专业培训，确保他们理解标注标准，熟悉工具使\n用。\n执行标注任务：分配数据给标注团队，设定清晰的任务指标和截止日期。\n质量控制与复查：实施多级检查，包括自动检查和人工复查，确保标注的准确性和\n一致性。\n数据整合与存储：将标注后的数据整合，形成__标注完整的高质量 __数据集，存储\n在安全的数据仓库中，供模型训练使用。", "scoring": "试题名称：自动驾驶汽车感知系统数据采集与标注指导\n考核时间：10min\n测量分评分表细则编\n号配分评分细则描述规定或\n标称值结果或\n实际值得分\nM1 5正确补充方案内容的每1个内容点\n得1分，总计得5分；根据数\n据\n第1个内容点正确，得1分\n第2个内容点正确，得1分\n第3个内容点正确，得1分\n第4个内容点正确，得1分\n第5个内容点正确，得1分\n合计配\n分5合计得分\n试题单", "reference": "", "id": 39, "page": 226}, {"name": "智能化数据标注在文化遗产数字化保护中的应用指导", "time": "10min", "question": "1.场地设备要求\n人工智能训练师主机：CPU（inteli5及以上）、内存（不少于16GB）、操作系统（windows10 ）、\n办公软件；\n2.工作任务\n文化遗产是人类历史和文明的重要载体，包括艺术、 建筑、 手工艺品、 文献等，它们\n承载着丰富的人文价值和历史信息。 然而，随着时间的流逝，许多文化遗产面临着自然侵蚀 、\n人为破坏以及缺乏有效保护手段的威胁。 近年来，数字化技术，尤其是人工智能和机器学习，\n为文化遗产的保护和传承提供了新的机遇 。通过高精度的图像和三维模型采集，结合智能化\n数据标注，可以创建文化遗产的数字档案，不仅能够永久保存文化遗产的状态，还能为修复 、\n研究和公众教育提供丰富的资源。\n智能化数据标注在文化遗产数字化保护中的业务需求包括：\n高精度标注：为了确保数字化模型的准确性和完整性，需要对文化遗产\n的每一个细节进行精确标注，包括文物的材质、 纹理、 结构特征、 损伤\n区域等。\n自动化与智能化：利用AI技术，实现对文化遗产图像和三维模型的自动\n化分析和标注，减少人力成本，提高工作效率。\n多维度数据融合：结合不同来源和类型的图像、 视频、 三维扫描数据，\n创建综合性的文化遗产数字档案。\n跨学科协作：促进文化遗产专家、 数据科学家和AI工程师之间的合作，\n共同推进文化遗产的数字化保护。\n尊重文化遗产持有者的权利和利益。\n你作为一名人工智能训练师，根据上述内容，补全智能化数据标注在文化遗产数字化\n保护中的应用指导方案（见素材文件夹中的4.2.5.docx）。\n所有结果文件储存在桌面新建的考生文件夹中，文件夹命名为 “准考证号 +身份证号后\n六位”。\n3.技能要求\n（1）能指导五级 /初级工、 四级 /中级工解决数据采集问题\n（2）能指导五级 /初级工、 四级 /中级工解决数据标注问题\n（3）能指导五级 /初级工、 四级 /中级工优化数据采集、 数据标注问题\n4.质量指标\n（1）数据采集和标注的指导方案内容合理可行；\n（2）确保数据采集和标注的完整和准确性；\nR6智能化数据标注在文化遗产数字化保护中的应用指导方案\n1.数据标注工具与方法\n图像标注：\n使用________Labellmg ______等标注工具，为文化遗产图像添加边界框 、多边\n形、 点、 线段等标注。\n对于复杂的文物细节，可以使用语义分割或实例分割技术，精细到每个物体的\n每一部分。\n三维模型标注：\n采用MeshLab或Blender等软件，对3D模型进行顶点 、面、体素级别的标注 。\n实现对模型内部结构和外部特征的全面标注。\n属性标签：\n文物的材料 、风格、时代、作者、位置等元数据，使用CSV、JSON等格式记录，\n并关联至相应的图像或模型。\n可以使用数据库管理系统（如MySQL、MongoDB）来存储和管理这些信息。\n2.智能化辅助标注\n深度学习模型：训练__能表示文化遗产数字化模型特征 ___的模型，如MaskR-CNN、\nU-Net等，用于自动识别和标记文物的特定特征。\n模型训练数据集：构建一个包含大量已标注文化遗产图像的数据集，用于模型训练\n和验证。\n模型迭代与优化：定期更新模型，引入新发现的文物类型和特征，提升识别精度。\n3.跨学科团队协作\n组建由考古学家、 艺术史家、 计算机视觉专家、 AI工程师组成的 __跨学科协作 __\n团队，共同制定标注标准和工作流程。\n定期举行会议，讨论标注过程中的问题，调整标注策略。\n4.数据安全与隐私保护\n使用___加密技术 .___存储和传输数据，确保文化遗产信息不被非法获取。\n遵守相关法律法规，特别是涉及文化遗产的所有权和使用权的规定。\n5.用户体验与公众教育\n开发Web应用或移动应用程序，允许用户在线浏览 、搜索和学习文化遗产的数字化\n资料。\n利用___虚拟现实和增强现实 __技术，为用户提供沉浸式文化遗产体验，增加教育\n和娱乐价值。\n6.技术融合与未来展望\nR6探索区块链技术的应用，为文化遗产的数字档案提供不可篡改的记录，增强其权威\n性和可信度。\n结合AI和物联网技术，监测和预警文化遗产的物理状态变化，及时采取保护措施 。", "scoring": "试题名称：智能化数据标注在文化遗产数字化保护中的应用指导\n考核时间：10min\n测量分评分表细则编\n号配分评分细则描述规定或\n标称值结果或\n实际值得分\nM1 5正确补充方案内容的每1个内容点\n得1分，总计得5分；根据数\n据\n第1个内容点正确，得1分\n第2个内容点正确，得1分\n第3个内容点正确，得1分\n第4个内容点正确，得1分\n第5个内容点正确，得1分\n合计配\n分5合计得分\nR6", "reference": "", "id": 40, "page": 230}];

function load() {
  try { var r = localStorage.getItem(SK); if (r) return JSON.parse(r); } catch(e) {}
  return {ci:0, answered:{}, wrong:[], total:0, correct:0, wrongCount:0, viewed:[]};
}
function save() {
  try { localStorage.setItem(SK, JSON.stringify(app)); } catch(e) {}
}
function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function toast(m) {
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

function init() {
  app = load();
  allQ = QUESTIONS_DATA;
  viewedSkills = app.viewed || [];
  if (app.ci >= allQ.length) app.ci = allQ.length - 1;
  if (app.ci < 0) app.ci = 0;

  // Countdown
  var examDate = new Date('2025-07-05');
  var today = new Date();
  var diff = Math.ceil((examDate - today) / 86400000);
  document.getElementById('daysLeft').textContent = diff > 0 ? diff : 0;

  updateStats();
  renderCats();
  renderSkillFilter();
  renderSkillList();
}

function updateStats() {
  document.getElementById('statTotal').textContent = app.total;
  document.getElementById('statCorrect').textContent = app.correct;
  document.getElementById('statWrong').textContent = app.wrongCount;
  var badge = document.getElementById('wrongBadge');
  if (app.wrong.length > 0) {
    badge.style.display = 'inline'; badge.textContent = app.wrong.length;
  } else { badge.style.display = 'none'; }
  var seq = document.getElementById('seqDesc');
  if (app.ci < allQ.length) {
    var pct = Math.round((app.ci + 1) / allQ.length * 100);
    seq.textContent = '已做 ' + app.total + ' 题，当前第 ' + (app.ci + 1) + ' 题 (' + pct + '%)';
  }
}

function renderCats() {
  var g = document.getElementById('catGrid');
  var h = '';
  for (var i = 0; i < CATEGORIES.length; i++) {
    var c = CATEGORIES[i];
    var n = 0;
    for (var j = 0; j < allQ.length; j++) { if (c.filter(allQ[j])) n++; }
    if (n === 0) continue;
    h += '<div class="cat-card" onclick="startCat(' + i + ')">' +
      '<span class="cat-num">' + (i + 1) + '</span>' +
      '<h4>' + c.label + '</h4><p>' + n + ' 题</p></div>';
  }
  g.innerHTML = h;
}

function switchTab(t) {
  curTab = t;
  document.getElementById('tabTheory').className = 'tab-btn' + (t === 'theory' ? ' active' : '');
  document.getElementById('tabSkills').className = 'tab-btn' + (t === 'skills' ? ' active' : '');
  document.getElementById('theoryPanel').style.display = t === 'theory' ? 'block' : 'none';
  document.getElementById('skillsPanel').style.display = t === 'skills' ? 'block' : 'none';
}

function modeTitle() {
  var m = {sequential:'顺序练习',random:'随机练习',wrong:'错题练习',mock:'模拟考试',category:cat};
  return m[mode] || '做题';
}

function hideAll() {
  ['homePage','quizPage','mockPage','wrongPage','jumpPage','skillDetailPage'].forEach(function(id) {
    document.getElementById(id).style.display = 'none';
  });
}

function showHome() {
  hideAll();
  document.getElementById('homePage').style.display = 'block';
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('topTitle').textContent = 'AI训练师';
  document.getElementById('bottomNav').style.display = 'flex';
  updateStats();
  mode = '';
}

function showQuiz() {
  hideAll();
  document.getElementById('quizPage').style.display = 'block';
  document.getElementById('backBtn').style.display = 'inline';
  document.getElementById('topTitle').textContent = modeTitle();
  document.getElementById('bottomNav').style.display = 'flex';
  renderQ();
}

function showMock(score, correct, total) {
  hideAll();
  document.getElementById('mockPage').style.display = 'block';
  document.getElementById('backBtn').style.display = 'inline';
  document.getElementById('topTitle').textContent = '考试结果';
  document.getElementById('bottomNav').style.display = 'flex';
  document.getElementById('mockScore').textContent = Math.round(score) + '%';
  document.getElementById('mockDetail').textContent = '共 ' + total + ' 题，正确 ' + correct + '，错误 ' + (total - correct);

  var wq = [];
  for (var i = 0; i < curQ.length; i++) {
    if (!ans[i] || !ans[i].correct) wq.push({q: curQ[i], idx: i});
  }
  var el = document.getElementById('mockWrongList');
  if (wq.length > 0) {
    var h = '<div class="section-label" style="margin-top:16px">做错的题目</div>';
    for (var k = 0; k < wq.length; k++) {
      var item = wq[k], q = item.q, r = ans[item.idx];
      var tc = q.type === 'judge' ? 'judge' : (q.type === 'multi' ? 'multi' : 'choice');
      var tl = q.type === 'judge' ? '判断题' : (q.type === 'multi' ? '多选题' : '单选题');
      h += '<div class="wrong-item"><div class="w-head"><span class="mode-num">' + q.num + '</span>' +
        '<span class="q-type ' + tc + '">' + tl + '</span></div>' +
        '<div class="w-body">' + esc(q.text) + '</div>' +
        '<div class="w-answer"><span class="ya">你的答案：' + (r ? r.yourAnswer : '-') + '</span><br>' +
        '<span class="ca">正确答案：' + q.answer + '</span></div>' +
        (q.explanation ? '<div class="w-exp">💡 ' + esc(q.explanation) + '</div>' : '') + '</div>';
    }
    el.innerHTML = h;
  } else {
    el.innerHTML = '<div class="mock-hero"><div class="score" style="color:var(--green)">✓</div>' +
      '<div class="score-label">全部正确！</div></div>';
  }
}

function showWrong() {
  hideAll();
  document.getElementById('wrongPage').style.display = 'block';
  document.getElementById('backBtn').style.display = 'inline';
  document.getElementById('topTitle').textContent = '错题本';
  document.getElementById('bottomNav').style.display = 'flex';
  renderWrongList();
}

function showJump() {
  hideAll();
  document.getElementById('jumpPage').style.display = 'block';
  document.getElementById('backBtn').style.display = 'inline';
  document.getElementById('topTitle').textContent = '题目跳转';
  document.getElementById('bottomNav').style.display = 'flex';
  renderJumpSec();
  renderJumpList();
}

function renderJumpSec() {
  var bar = document.getElementById('jumpSecBar');
  var secs = [{l:'判断题',t:'judge'},{l:'单选题',t:'choice'},{l:'多选题',t:'multi'}];
  var h = '';
  for (var i = 0; i < secs.length; i++) {
    var cls = 'filter-btn' + (secs[i].t === jumpSec ? ' active' : '');
    h += '<button class="' + cls + '" onclick="setJumpSec(\'' + secs[i].t + '\')">' + secs[i].l + '</button>';
  }
  bar.innerHTML = h;
}
function setJumpSec(t) { jumpSec = t; renderJumpSec(); }

function goBack() { showHome(); }

function startMode(m) {
  mode = m; ans = {};
  if (m === 'sequential') { curQ = allQ; idx = app.ci; }
  else if (m === 'random') { curQ = shuffle(allQ); idx = 0; }
  else if (m === 'wrong') {
    var wm = {}; app.wrong.forEach(function(k) { wm[k] = true; });
    curQ = shuffle(allQ.filter(function(q) { return wm[qk(q)]; }));
    if (curQ.length === 0) { toast('错题本为空，继续保持！'); return; }
    idx = 0;
  } else if (m === 'mock') { curQ = shuffle(allQ).slice(0, 100); idx = 0; }
  showQuiz();
}

function startCat(i) {
  if (i >= CATEGORIES.length) return;
  var c = CATEGORIES[i];
  cat = c.label;
  var f = allQ.filter(function(q) { return c.filter(q); });
  if (f.length === 0) { toast('该分类暂无题目'); return; }
  curQ = f; mode = 'category'; idx = 0; ans = {};
  showQuiz();
}

function renderQ() {
  if (idx < 0 || idx >= curQ.length) return;
  var q = curQ[idx];
  document.getElementById('qCounter').textContent = (idx + 1) + '/' + curQ.length;
  var te = document.getElementById('qType');
  var tl, tc;
  if (q.type === 'judge') { tl = '判断题'; tc = 'judge'; }
  else if (q.type === 'multi') { tl = '多选题'; tc = 'multi'; }
  else { tl = '单选题'; tc = 'choice'; }
  te.textContent = tl; te.className = 'q-type ' + tc;
  document.getElementById('qNumTag').textContent = '第 ' + q.num + ' 题';
  document.getElementById('qText').innerHTML = esc(q.text);

  var area = document.getElementById('optionsArea');
  var prev = ans[idx];

  if (q.type === 'judge') {
    var dis = prev ? ' class="disabled"' : '';
    area.innerHTML = '<div class="judge-options">' +
      '<div class="judge-opt"' + dis + ' onclick="selJudge(\'正确\')">✓ 正确</div>' +
      '<div class="judge-opt"' + dis + ' onclick="selJudge(\'错误\')">✗ 错误</div></div>';
    if (prev) {
      var opts = area.querySelectorAll('.judge-opt');
      for (var o = 0; o < opts.length; o++) {
        var v = opts[o].textContent.replace(/[✓✗ ]/g, '').trim();
        if (v === q.answer) opts[o].classList.add('correct');
        if (v === prev.yourAnswer && v !== q.answer) opts[o].classList.add('wrong');
      }
    }
  } else if (q.type === 'multi') {
    multiSel = [];
    var h = '<div class="options">';
    for (var oi = 0; oi < q.options.length; oi++) {
      var opt = q.options[oi], cls = 'option';
      if (prev) {
        cls += ' disabled';
        if (q.answer.indexOf(opt.label) !== -1) cls += ' correct';
        if (prev.yourAnswer.indexOf(opt.label) !== -1 && q.answer.indexOf(opt.label) === -1) cls += ' wrong';
      }
      h += '<div class="' + cls + '" data-label="' + opt.label + '" onclick="toggleMulti(\'' + opt.label + '\')">' +
        '<span class="opt-label">' + opt.label + '.</span>' + esc(opt.text) + '</div>';
    }
    h += '</div>';
    if (!prev) {
      h += '<div style="margin-top:12px"><button class="nav-btn next" style="width:100%" onclick="confirmMulti()">确认提交</button></div>';
    }
    area.innerHTML = h;
  } else {
    var h = '<div class="options">';
    for (var oi = 0; oi < q.options.length; oi++) {
      var opt = q.options[oi], cls = 'option';
      if (prev) {
        cls += ' disabled';
        if (q.answer.indexOf(opt.label) !== -1) cls += ' correct';
        if (prev.yourAnswer.indexOf(opt.label) !== -1 && q.answer.indexOf(opt.label) === -1) cls += ' wrong';
      }
      h += '<div class="' + cls + '" onclick="selChoice(\'' + opt.label + '\')">' +
        '<span class="opt-label">' + opt.label + '.</span>' + esc(opt.text) + '</div>';
    }
    h += '</div>'; area.innerHTML = h;
  }

  var ee = document.getElementById('explanation');
  if (prev) {
    ee.innerHTML = '<strong>' + (prev.correct ? '✅ 正确！' : '❌ 错误！正确答案：' + q.answer) + '</strong>' +
      (q.explanation ? '<br>' + esc(q.explanation) : '');
    ee.classList.add('show');
  } else { ee.classList.remove('show'); }
}

function selJudge(a) {
  if (ans[idx] !== undefined) return;
  var q = curQ[idx], ok = a === q.answer;
  ans[idx] = {correct: ok, yourAnswer: a};
  doRecord(q, ok, a);
  renderQ();
  if (ok) { setTimeout(function() { nextQ(); }, 500); }
  else { toast('❌ 正确答案：' + q.answer); }
}

function selChoice(l) {
  if (ans[idx] !== undefined) return;
  var q = curQ[idx], ok = l === q.answer;
  ans[idx] = {correct: ok, yourAnswer: l};
  doRecord(q, ok, l);
  renderQ();
  if (ok) { setTimeout(function() { nextQ(); }, 500); }
  else { toast('❌ 正确答案：' + q.answer); }
}

function toggleMulti(l) {
  if (ans[idx] !== undefined) return;
  var i = multiSel.indexOf(l);
  if (i === -1) multiSel.push(l); else multiSel.splice(i, 1);
  multiSel.sort();
  var opts = document.querySelectorAll('#optionsArea .option');
  for (var o = 0; o < opts.length; o++) {
    var lb = opts[o].getAttribute('data-label');
    if (multiSel.indexOf(lb) !== -1) {
      opts[o].style.borderColor = 'var(--clay)';
      opts[o].style.background = 'var(--amber-light)';
    } else {
      opts[o].style.borderColor = '';
      opts[o].style.background = '';
    }
  }
}

function confirmMulti() {
  if (ans[idx] !== undefined) return;
  if (multiSel.length === 0) { toast('请至少选择一个选项'); return; }
  var q = curQ[idx];
  var yourAnswer = multiSel.join('');
  var ok = yourAnswer === q.answer;
  ans[idx] = {correct: ok, yourAnswer: yourAnswer};
  doRecord(q, ok, yourAnswer);
  renderQ();
  if (ok) { setTimeout(function() { nextQ(); }, 500); }
  else { toast('❌ 正确答案：' + q.answer); }
}

function doRecord(q, ok, ya) {
  app.total++;
  if (ok) {
    app.correct++;
    app.wrong = app.wrong.filter(function(k) { return k !== qk(q); });
  } else {
    app.wrongCount++;
    if (app.wrong.indexOf(qk(q)) === -1) app.wrong.push(qk(q));
  }
  app.answered[qk(q)] = {correct: ok, yourAnswer: ya, correctAnswer: q.answer};
  if (mode === 'sequential' && idx >= app.ci) app.ci = idx + 1;

  if (mode === 'mock' && idx === curQ.length - 1) {
    var cc = 0;
    for (var i = 0; i < curQ.length; i++) { if (ans[i] && ans[i].correct) cc++; }
    app.viewed = viewedSkills; save();
    setTimeout(function() { showMock(cc / curQ.length * 100, cc, curQ.length); }, 400);
    return;
  }
  app.viewed = viewedSkills; save();
}

function nextQ() { if (idx < curQ.length - 1) { idx++; renderQ(); } }
function prevQ() { if (idx > 0) { idx--; renderQ(); } }

function jumpToQ() {
  var num = parseInt(document.getElementById('jumpInput').value);
  if (!num) return;
  var i = allQ.findIndex(function(q) { return q.type === jumpSec && q.num === num; });
  if (i === -1) { toast('未找到该题型第 ' + num + ' 题'); return; }
  curQ = allQ; mode = 'sequential'; idx = i; ans = {};
  app.ci = i; app.viewed = viewedSkills; save();
  showQuiz();
}

function renderJumpList() {
  var el = document.getElementById('jumpList');
  var h = '', secs = [{l:'判断题',t:'judge'},{l:'单选题',t:'choice'},{l:'多选题',t:'multi'}];
  for (var s = 0; s < secs.length; s++) {
    var sec = secs[s];
    var qs = allQ.filter(function(q) { return q.type === sec.t; });
    h += '<div class="jump-cat"><h4>' + sec.l + ' (' + qs.length + '题)</h4>';
    for (var j = 0; j < qs.length; j++) {
      var q = qs[j];
      var cls = app.answered[qk(q)] ? 'jl done' : 'jl';
      h += '<span class="' + cls + '" onclick="doJump(\'' + q.type + '\',' + q.num + ')">' + q.num + '</span>';
    }
    h += '</div>';
  }
  el.innerHTML = h;
}

function doJump(type, num) {
  var i = allQ.findIndex(function(q) { return q.type === type && q.num === num; });
  if (i === -1) return;
  curQ = allQ; mode = 'sequential'; idx = i; ans = {};
  app.ci = i; app.viewed = viewedSkills; save();
  showQuiz();
}

function renderWrongList() {
  document.getElementById('wrongCount') && (document.getElementById('wrongCount').textContent = app.wrong.length);
  var el = document.getElementById('wrongList');
  if (app.wrong.length === 0) {
    el.innerHTML = '<div class="mock-hero"><div class="score" style="color:var(--green)">✓</div>' +
      '<div class="score-label">太棒了！错题本是空的</div></div>';
    return;
  }
  var h = '';
  for (var w = 0; w < app.wrong.length; w++) {
    var key = app.wrong[w];
    var q = allQ.find(function(x) { return qk(x) === key; });
    if (!q) continue;
    var r = app.answered[key];
    var tc = q.type === 'judge' ? 'judge' : (q.type === 'multi' ? 'multi' : 'choice');
    var tl = q.type === 'judge' ? '判断题' : (q.type === 'multi' ? '多选题' : '单选题');
    h += '<div class="wrong-item"><div class="w-head"><span class="mode-num">' + q.num + '</span>' +
      '<span class="q-type ' + tc + '">' + tl + '</span></div>' +
      '<div class="w-body">' + esc(q.text) + '</div>' +
      '<div class="w-answer"><span class="ya">你的答案：' + (r ? r.yourAnswer : '-') + '</span><br>' +
      '<span class="ca">正确答案：' + q.answer + '</span></div>' +
      (q.explanation ? '<div class="w-exp">💡 ' + esc(q.explanation) + '</div>' : '') + '</div>';
  }
  el.innerHTML = h;
}

function clearWrong() {
  if (!confirm('确定清空错题本？')) return;
  app.wrong = []; app.viewed = viewedSkills; save();
  renderWrongList(); updateStats();
  toast('错题本已清空');
}

/* ===== SKILLS ===== */
function getSkillCat(name) {
  if (name.indexOf('业务数据') !== -1 || name.indexOf('数据处理') !== -1) return '业务数据处理';
  if (name.indexOf('模型') !== -1 || name.indexOf('优化') !== -1) return '模型训练与优化';
  if (name.indexOf('清洗') !== -1 || name.indexOf('标注') !== -1 || name.indexOf('Labelstudio') !== -1) return '数据清洗与标注';
  if (name.indexOf('分析') !== -1 || name.indexOf('可视化') !== -1) return '数据分析与优化';
  if (name.indexOf('指南') !== -1) return '数据采集指南';
  if (name.indexOf('Python') !== -1 || name.indexOf('Pandas') !== -1 || name.indexOf('训练手记') !== -1) return '工具操作训练';
  return '业务数据处理';
}

function renderSkillFilter() {
  var bar = document.getElementById('skillFilter');
  var h = '';
  for (var i = 0; i < skillCats.length; i++) {
    var cls = 'filter-btn' + (skillCats[i] === skillFilter ? ' active' : '');
    h += '<button class="' + cls + '" onclick="setSF(\'' + skillCats[i] + '\')">' + skillCats[i] + '</button>';
  }
  bar.innerHTML = h;
}

function setSF(c) { skillFilter = c; renderSkillFilter(); renderSkillList(); }

function renderSkillList() {
  var el = document.getElementById('skillList');
  var sv = (document.getElementById('skillSearch') || {}).value || '';
  sv = sv.toLowerCase();
  var h = '';
  for (var i = 0; i < SKILLS_DATA.length; i++) {
    var p = SKILLS_DATA[i];
    var pc = getSkillCat(p.name);
    if (skillFilter !== '全部' && pc !== skillFilter) continue;
    if (sv && p.name.toLowerCase().indexOf(sv) === -1) continue;
    var viewed = viewedSkills.indexOf(p.id) !== -1;
    h += '<div class="skill-item" onclick="viewSkill(' + p.id + ')">' +
      '<h4><span class="si">' + p.id + '</span> ' + (viewed ? '✓ ' : '') + p.name + '</h4>' +
      '<p>' + pc + (p.page ? ' · PDF第' + p.page + '页' : '') + '</p></div>';
  }
  if (!h) h = '<p style="text-align:center;color:var(--lead);padding:40px;font-size:14px">没有找到匹配的试题</p>';
  el.innerHTML = h;
}

function filterSkills() { renderSkillList(); }

function formatSkillText(text) {
  if (!text) return '';
  var lines = text.split('\n');
  var h = '';
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    if (!l.trim()) continue;
    if (re_match(l, /^\d+[\.\、]/)) {
      h += '<div class="sh">' + esc(l) + '</div>';
    } else if (re_match(l, /^（\d+）/)) {
      h += '<span class="si">' + esc(l) + '</span>';
    } else if (re_match(l, /^M\d+/)) {
      h += '<span class="si">' + esc(l) + '</span>';
    } else {
      h += esc(l) + '\n';
    }
  }
  return h;
}
function re_match(s, r) { return r.test(s); }

function toggleSdAnswer() {
  var w = document.getElementById('sdScoringWrap');
  var a = document.getElementById('sdArrow');
  if (w.classList.contains('show')) {
    w.classList.remove('show'); a.classList.remove('open');
  } else {
    w.classList.add('show'); a.classList.add('open');
  }
}

function viewSkill(id) {
  if (viewedSkills.indexOf(id) === -1) viewedSkills.push(id);
  app.viewed = viewedSkills; save();
  renderSkillList();
  var p = null;
  for (var i = 0; i < SKILLS_DATA.length; i++) {
    if (SKILLS_DATA[i].id === id) { p = SKILLS_DATA[i]; break; }
  }
  if (!p) return;
  hideAll();
  document.getElementById('skillDetailPage').style.display = 'block';
  document.getElementById('backBtn').style.display = 'inline';
  document.getElementById('topTitle').textContent = '试题 ' + p.id;
  document.getElementById('bottomNav').style.display = 'flex';
  document.getElementById('sdName').textContent = p.name;
  var meta = '<span>⏱ ' + (p.time || '30min') + '</span><span>📄 试题 ' + p.id + '</span>';
  if (p.page) meta += '<span>📑 PDF第' + p.page + '页</span>';
  document.getElementById('sdMeta').innerHTML = meta;
  // PDF link button
  var pdfLinkEl = document.getElementById('sdPdfLink');
  if (p.page) {
    pdfLinkEl.style.display = 'inline-flex';
    pdfLinkEl.onclick = function() { openSkillPdf(p.id); };
    pdfLinkEl.textContent = '📑 查看PDF原文（第' + p.page + '页）';
  } else {
    pdfLinkEl.style.display = 'none';
  }
  document.getElementById('sdQuestion').innerHTML = formatSkillText(p.question);
  // Scoring / answer
  var ss = document.getElementById('sdScoringSec');
  if (p.scoring) {
    ss.style.display = 'block';
    document.getElementById('sdScoring').innerHTML = formatSkillText(p.scoring);
    document.getElementById('sdScoringWrap').classList.remove('show');
    document.getElementById('sdArrow').classList.remove('open');
  } else { ss.style.display = 'none'; }
  // Reference code
  var rs = document.getElementById('sdRefSec');
  if (p.reference) {
    rs.style.display = 'block';
    document.getElementById('sdRef').textContent = p.reference;
  } else { rs.style.display = 'none'; }
}

function updateSkillStats() {
  var se = document.getElementById('statTotal');
  if (se) se.textContent = app.total;
}

init();

/* ===== PDF VIEWER (PDF.js canvas 渲染，兼容移动端) ===== */
var PDF_FILE = 'skills_nopass.pdf';
var PDF_TOTAL = 234;
var pdfCurPage = 1;
var pdfPrevPage = null;
var _pdfSavedBackDisplay = '';
var _pdfDoc = null;
var _pdfDocLoading = null;
var _pdfRenderTask = null;

function _pdfSetWorker() {
  if (window.pdfjsLib && !pdfjsLib.GlobalWorkerOptions.workerSrc) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
  }
}

function _pdfEnsureDoc() {
  _pdfSetWorker();
  if (_pdfDoc) return Promise.resolve(_pdfDoc);
  if (_pdfDocLoading) return _pdfDocLoading;
  if (typeof pdfjsLib === 'undefined') return Promise.reject(new Error('pdfjs missing'));
  _pdfDocLoading = pdfjsLib.getDocument(PDF_FILE).promise.then(function (doc) {
    _pdfDoc = doc; return doc;
  }, function (err) { _pdfDocLoading = null; throw err; });
  return _pdfDocLoading;
}

function _pdfShowLoading(show, text) {
  var el = document.getElementById('pdfLoading');
  if (!el) return;
  if (text) { var t = document.getElementById('pdfLoadingText'); if (t) t.textContent = text; }
  el.style.display = show ? 'flex' : 'none';
}

function _pdfShowFallback(show) {
  var el = document.getElementById('pdfFallback');
  if (el) el.style.display = show ? 'flex' : 'none';
}

function renderPdfPage(num) {
  var wrap = document.getElementById('pdfFrameWrap');
  var canvas = document.getElementById('pdfCanvas');
  if (!wrap || !canvas) return;
  _pdfShowFallback(false);
  _pdfShowLoading(true, '加载第 ' + num + ' 页…');
  if (_pdfRenderTask) { try { _pdfRenderTask.cancel(); } catch (e) {} _pdfRenderTask = null; }

  _pdfEnsureDoc().then(function (doc) { return doc.getPage(num); }).then(function (page) {
    var base = page.getViewport({ scale: 1 });
    var cssWidth = wrap.clientWidth || 360;
    var scale = cssWidth / base.width;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var viewport = page.getViewport({ scale: scale * dpr });
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    canvas.style.width = Math.floor(viewport.width / dpr) + 'px';
    canvas.style.height = Math.floor(viewport.height / dpr) + 'px';
    var ctx = canvas.getContext('2d');
    _pdfRenderTask = page.render({ canvasContext: ctx, viewport: viewport });
    return _pdfRenderTask.promise;
  }).then(function () {
    _pdfShowLoading(false);
  }).catch(function (err) {
    if (err && err.name === 'RenderingCancelledException') return;
    _pdfShowLoading(false);
    console.error('PDF render error', err);
    _pdfShowFallback(true);
  });
}

function _updatePdfNav() {
  document.getElementById('pdfPgNum').textContent = pdfCurPage + '/' + PDF_TOTAL;
  document.getElementById('pdfPrev').disabled = pdfCurPage <= 1;
  document.getElementById('pdfNext').disabled = pdfCurPage >= PDF_TOTAL;
  var ext = document.getElementById('pdfExtLink');
  if (ext) ext.href = PDF_FILE + '#page=' + pdfCurPage;
}

function openPdf(page, title) {
  pdfPrevPage = document.querySelector('.pdf-page.show') ? pdfCurPage : null;
  pdfCurPage = Math.max(1, Math.min(page || 1, PDF_TOTAL));
  document.getElementById('pdfTitle').textContent = title || '操作技能题 PDF原文';
  document.getElementById('pdfPage').classList.add('show');
  document.getElementById('bottomNav').style.display = 'none';
  _pdfSavedBackDisplay = document.getElementById('backBtn').style.display;
  document.getElementById('backBtn').style.display = 'none';
  var wrap = document.getElementById('pdfFrameWrap');
  if (wrap) wrap.scrollTop = 0;
  loadPdfPage();
}

function loadPdfPage() {
  _updatePdfNav();
  var wrap = document.getElementById('pdfFrameWrap');
  if (wrap) wrap.scrollTop = 0;
  renderPdfPage(pdfCurPage);
}

function pdfNav(d) {
  var np = pdfCurPage + d;
  if (np < 1 || np > PDF_TOTAL) return;
  pdfCurPage = np;
  loadPdfPage();
}

function closePdf() {
  document.getElementById('pdfPage').classList.remove('show');
  if (_pdfRenderTask) { try { _pdfRenderTask.cancel(); } catch (e) {} _pdfRenderTask = null; }
  var canvas = document.getElementById('pdfCanvas');
  if (canvas) { canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height); }
  document.getElementById('bottomNav').style.display = 'flex';
  document.getElementById('backBtn').style.display = _pdfSavedBackDisplay;
}

function openSkillPdf(id) {
  var p = null;
  for (var i = 0; i < SKILLS_DATA.length; i++) {
    if (SKILLS_DATA[i].id === id) { p = SKILLS_DATA[i]; break; }
  }
  if (!p || !p.page) { toast('该题暂无PDF原文'); return; }
  openPdf(p.page, '试题' + p.id + ' · ' + p.name);
}

var _pdfResizeTimer = null;
window.addEventListener('resize', function () {
  var pg = document.getElementById('pdfPage');
  if (!pg || !pg.classList.contains('show')) return;
  clearTimeout(_pdfResizeTimer);
  _pdfResizeTimer = setTimeout(function () { renderPdfPage(pdfCurPage); }, 200);
});

</script>

<!-- ===== PDF VIEWER ===== -->
<div class="pdf-page" id="pdfPage">
  <div class="pdf-topbar">
    <button class="pdf-back" onclick="closePdf()">←</button>
    <span class="pdf-title" id="pdfTitle">PDF原文</span>
    <div class="pdf-pg-nav">
      <button onclick="pdfNav(-1)" id="pdfPrev">‹</button>
      <span class="pdf-pg-num" id="pdfPgNum">1/234</span>
      <button onclick="pdfNav(1)" id="pdfNext">›</button>
    </div>
  </div>
  <div class="pdf-frame-wrap" id="pdfFrameWrap">
    <canvas id="pdfCanvas"></canvas>
    <div class="pdf-loading" id="pdfLoading" style="display:none">
      <div class="pdf-spinner"></div>
      <div id="pdfLoadingText">加载PDF…</div>
    </div>
    <div class="pdf-fallback" id="pdfFallback" style="display:none">
      <div>📄 无法在此预览PDF</div>
      <a id="pdfExtLink" href="#" target="_blank">点击在浏览器中打开PDF</a>
    </div>
  </div>
</div>
